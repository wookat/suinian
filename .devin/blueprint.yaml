# https://docs.devin.ai/onboard-devin/environment-yaml
# Commands run from the repo root.
initialize:
  - name: android sdk (assembleDebug 需要)
    run: |
      mkdir -p ~/Android/Sdk/cmdline-tools
      curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
      rm -rf /tmp/cmdtools && unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
      mkdir -p ~/Android/Sdk/cmdline-tools/latest && cp -r /tmp/cmdtools/cmdline-tools/* ~/Android/Sdk/cmdline-tools/latest/
      echo "ANDROID_HOME=$HOME/Android/Sdk" >> $ENVRC
      echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $ENVRC
      yes | ~/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/Android/Sdk --licenses >/dev/null 2>&1 || true
      ~/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/Android/Sdk "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools"
      echo "sdk.dir=$HOME/Android/Sdk" > android/local.properties
maintenance: |
  (cd backend && npm install)
  (cd web && npm install)
  (cd extension && npm install)
  (cd mcp && npm install)
knowledge:
  - name: test
    contents: |
      backend: cd backend && npm test && npx tsc --noEmit ｜ web: cd web && npx tsc -b && npm run lint && npm run build ｜ android: cd android && ./gradlew testDebugUnitTest assembleDebug
  - name: deploy
    contents: |
      生产 = 新 CF 账户（583090ace6fb9a02db3f2625487ed865）：CLOUDFLARE_API_TOKEN=$CLOUDFLARE_NEW_ACCOUNT_API_TOKEN CLOUDFLARE_ACCOUNT_ID=583090ace6fb9a02db3f2625487ed865；Worker: cd backend && wrangler versions upload --var BUILD_SHA:$(git rev-parse --short HEAD) → wrangler versions deploy <vid>@100% -y；Pages: cd web && BUILD_SHA=<sha> npm run build && wrangler pages deploy dist --project-name suinian --branch main --commit-hash <sha>；核验 /health 的 build == web meta build == SHA
  - name: checks
    contents: |
      无 GitHub Actions；合并前本机全绿：backend vitest+tsc / web tsc+lint+build / android testDebugUnitTest+assembleDebug；禁直接推 main；QA 账号 [QA-RNNN] 前缀用完 DELETE /api/auth/me 自删
