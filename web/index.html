  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="canonical" href="https://suinian.zalize.com/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="碎念 Suinian — 像发消息一样记录一切" />
    <meta property="og:description" content="什么都能丢的 AI 收件箱：自动分拣、串线索、每周报告，支持微信、剪藏扩展、Android、MCP 多入口" />

    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>碎念 Suinian</title>
    <style>
      /* 首屏内联骨架（R221 P3-1）：JS 包下载/解析期间不再纯白，React 挂载后整体替换 */
      #root:empty { display: block; min-height: 100vh; background: #fafafa; }
      @media (prefers-color-scheme: dark) { #root:empty { background: #18181b; } }
      #root:empty::before {
        content: "";
        display: block;
        margin: 24px auto 0;
        max-width: 640px;
        height: 264px;
        border-radius: 12px;
        background:
          linear-gradient(#e4e4e7 0 0) 16px 16px / calc(100% - 32px) 56px,
          linear-gradient(#e4e4e7 0 0) 16px 96px / calc(100% - 32px) 56px,
          linear-gradient(#e4e4e7 0 0) 16px 176px / calc(100% - 32px) 56px;
        background-repeat: no-repeat;
        animation: sn-pulse 1.4s ease-in-out infinite;
      }
      @media (prefers-color-scheme: dark) {
        #root:empty::before {
          background:
            linear-gradient(#27272a 0 0) 16px 16px / calc(100% - 32px) 56px,
            linear-gradient(#27272a 0 0) 16px 96px / calc(100% - 32px) 56px,
            linear-gradient(#27272a 0 0) 16px 176px / calc(100% - 32px) 56px;
          background-repeat: no-repeat;
        }
      }
      @keyframes sn-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
