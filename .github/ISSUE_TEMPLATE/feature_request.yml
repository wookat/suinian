name: 功能建议
description: 提出新功能或改进建议 / Suggest a feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你的使用场景与痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 涉及组件
      multiple: true
      options:
        - backend（Workers API）
        - web（网页端）
        - skill/bridge（微信 bot 桥）
        - android
        - docs / 部署
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 补充说明
