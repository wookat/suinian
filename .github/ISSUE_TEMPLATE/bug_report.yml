name: Bug 报告
description: 报告一个 bug / Report a bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 涉及组件
      multiple: true
      options:
        - backend（Workers API）
        - web（网页端）
        - skill/bridge（微信 bot 桥）
        - android
        - docs / 部署
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      placeholder: 浏览器/系统版本、自部署还是官方实例、wrangler 版本等
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图
      description: 注意打码 token 等敏感信息
