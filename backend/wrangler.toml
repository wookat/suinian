name = "suinian-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "suinian-api.zalize.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "suinian"
database_id = "8a0a1fc0-c714-4822-a915-b1791f1599a1"

[ai]
binding = "AI"

# Optional: Cloudflare Vectorize for semantic search. Without this binding the
# worker falls back to D1-stored vectors (note_embeddings) with brute-force
# cosine, which is fine for personal-scale data. To enable Vectorize:
#   npx wrangler vectorize create suinian-notes --dimensions=1024 --metric=cosine
#   npx wrangler vectorize create-metadata-index suinian-notes --property-name=user_id --type=string
# then uncomment:
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "suinian-notes"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "suinian-media"

[triggers]
crons = ["0 0 * * 1", "0 0 1 * *", "0 20 * * *", "*/10 * * * *"]

[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
REGISTRATION_ENABLED = "true"
